version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronon_password}
      POSTGRES_DB: ${POSTGRES_DB:-chronon_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronon_user} -d ${POSTGRES_DB:-chronon_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: chronon_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chronon_user}:${POSTGRES_PASSWORD:-chronon_password}@postgres:5432/${POSTGRES_DB:-chronon_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-chronon_user}:${POSTGRES_PASSWORD:-chronon_password}@postgres:5432/${POSTGRES_DB:-chronon_db}
      ENVIRONMENT: development
      DEBUG: "true"
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: chronon_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
    driver: local
